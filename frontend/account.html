<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет — Silk Beauty</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'silk-pink': '#B8828E',
                        'silk-dark-pink': '#9D6B77',
                        'silk-light': '#F5EDE8',
                        'silk-dark': '#2D2D2D',
                        'silk-gray': '#7A7A7A',
                    },
                    fontFamily: {
                        'playfair': ['Playfair Display', 'serif'],
                        'inter': ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="font-inter text-silk-dark relative overflow-x-hidden" style="background-image: url('images/salon/background.jpg'); background-size: cover; background-position: center; background-attachment: fixed; background-repeat: no-repeat;">
    
    <header class="flex justify-between items-center px-8 md:px-20 py-5 bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50">
        <a href="index.html" class="font-playfair text-2xl font-bold text-silk-pink">Silk Beauty</a>
        <nav class="hidden md:flex gap-8 font-semibold text-sm">
            <a href="index.html" class="hover:text-silk-pink transition">Главная</a>
            <a href="services.html" class="hover:text-silk-pink transition">Услуги</a>
            <a href="masters.html" class="hover:text-silk-pink transition">Мастера</a>
            <a href="portfolio.html" class="hover:text-silk-pink transition">Портфолио</a>
            <a href="about.html" class="hover:text-silk-pink transition">О нас</a>
            <a href="account.html" class="text-silk-pink transition">Личный кабинет</a>
        </nav>
        <button onclick="openBooking()" class="bg-silk-pink text-white px-6 py-3 rounded-full font-semibold hover:bg-silk-dark-pink transition shadow-lg shadow-silk-pink/30">Записаться</button>
    </header>

    <section class="px-8 md:px-20 py-20 max-w-4xl mx-auto">
        <div class="bg-white/90 backdrop-blur-md rounded-[40px] p-10 md:p-16 shadow-2xl border border-white">
            
            <div class="flex items-center gap-6 mb-10 border-b border-gray-200 pb-8">
                <div id="avatar" class="w-24 h-24 rounded-full bg-silk-pink text-white flex items-center justify-center text-4xl font-bold shadow-lg">...</div>
                <div>
                    <h1 class="font-playfair text-4xl font-bold mb-2" id="user-name">Загрузка...</h1>
                    <p class="text-silk-gray" id="user-email">...</p>
                </div>
            </div>

            <div class="grid md:grid-cols-2 gap-8">
                <div class="bg-silk-light/50 p-6 rounded-2xl">
                    <h3 class="font-playfair text-xl font-bold mb-4">Мои данные</h3>
                    <p class="text-sm text-silk-gray mb-2">Email:</p>
                    <p class="font-semibold mb-4" id="info-email">...</p>
                    
                    <p class="text-sm text-silk-gray mb-2">Пароль:</p>
                    <p class="font-semibold mb-4">••••••••</p>
                </div>

                <div class="bg-silk-light/50 p-6 rounded-2xl flex flex-col justify-between">
                    <div>
                        <h3 class="font-playfair text-xl font-bold mb-4">Мои записи</h3>
                        <div id="bookings-list">
                            <p class="text-silk-gray text-sm">Загрузка записей...</p>
                        </div>
                    </div>
                    <button onclick="openBooking()" class="w-full bg-silk-pink text-white py-3 rounded-xl font-bold hover:bg-silk-dark-pink transition shadow-lg mt-4">Новая запись</button>
                </div>
            </div>

            <div class="mt-10 text-center">
                <button onclick="logout()" class="text-gray-500 hover:text-red-500 font-semibold transition">Выйти из аккаунта</button>
            </div>

        </div>
    </section>

    <script src="js/booking.js"></script>
    <script>
        const SUPABASE_URL = "https://toedeeggcbgdyvtfpntq.supabase.co";
        const SUPABASE_KEY = "sb_publishable_UTAh07w33ICbgMDLI2lV9Q_bFRAERc3";
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function checkUser() {
            const { data: { user }, error } = await supabaseClient.auth.getUser();
            
            if (error || !user) {
                window.location.href = 'login.html';
                return;
            }

            // Берем имя из метаданных (которые мы сохранили при регистрации)
            const name = user.user_metadata.full_name || 'Пользователь';
            const email = user.email;

            document.getElementById('user-name').textContent = name;
            document.getElementById('user-email').textContent = email;
            document.getElementById('info-email').textContent = email;
            document.getElementById('avatar').textContent = name[0].toUpperCase();

            loadBookings(email);
        }

        async function loadBookings(email) {
            const container = document.getElementById('bookings-list');
            
            const { data: bookings, error } = await supabaseClient
                .from('bookings')
                .select('*')
                .eq('user_email', email)
                .order('created_at', { ascending: false });

            if (error || !bookings || bookings.length === 0) {
                container.innerHTML = '<p class="text-silk-gray text-sm">У вас пока нет активных записей.</p>';
                return;
            }

            container.innerHTML = bookings.map(b => `
                <div class="bg-white p-4 rounded-xl mb-3 shadow-sm border border-gray-100 flex justify-between items-start group">
                    <div>
                        <div class="font-semibold text-silk-pink text-lg">${b.service_name}</div>
                        
                        <div class="text-sm text-silk-dark mt-1">
                            <span class="font-semibold">Дата:</span> ${b.booking_date}
                        </div>
                        <div class="text-sm text-silk-dark">
                            <span class="font-semibold">Время:</span> ${b.booking_time}
                        </div>

                        ${b.comment ? `
                            <div class="text-sm text-silk-gray mt-2 italic bg-silk-light/50 p-2 rounded">
                                "${b.comment}"
                            </div>
                        ` : ''}

                        <div class="text-xs text-silk-gray mt-2">Статус: ${b.status === 'active' ? 'Активна' : 'Завершена'}</div>
                    </div>
                    
                    <button onclick="deleteBooking(${b.id})" class="text-gray-300 hover:text-red-500 transition p-2 mt-1" title="Отменить запись">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                </div>
            `).join('');
        }

        async function deleteBooking(id) {
            if (!confirm('Вы уверены, что хотите отменить эту запись?')) return;

            const { error } = await supabaseClient
                .from('bookings')
                .delete()
                .eq('id', id);

            if (error) {
                alert('Ошибка при удалении: ' + error.message);
            } else {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (user) loadBookings(user.email);
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        }

        window.onload = checkUser;
    </script>
</body>
</html>
