<!DOCTYPE html>
<html lang="ru">

<head>

    <script src="https://cdn.tailwindcss.com"></script>

                        'silk-pink': '#B8828E',
                        'silk-dark-pink': '#9D6B77',
                        'silk-light': '#F5EDE8',
                        'silk-gold': '#C9A96E',

                    fontFamily: {
                        'playfair': ['Playfair Display', 'serif'],
                        'inter': ['Inter', 'sans-serif'],
                    }
                }
            }
        }

</head>

<body class="font-inter text-silk-dark">

    <header class="flex justify-between items-center px-20 py-5 bg-white shadow-md sticky top-0 z-50">

        <nav class="flex gap-8">

    <section class="px-20 py-20">

        <div id="masters-list" class="grid grid-cols-4 gap-8">
            <div class="text-center text-silk-gray py-10 col-span-4">Загрузка...</div>
        </div>
    </section>

    <footer class="bg-silk-dark text-white px-20 py-6 text-center">
