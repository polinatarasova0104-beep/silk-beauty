services:
  backend:
    build: ../backend
    environment:
      - DB_FILE=silk_beauty.db
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ../frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped